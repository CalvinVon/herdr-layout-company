<title>Herdr 亮色主题 · 四版选择</title>
<!--
  Assumptions: compare color only; layout, type, spacing and content stay identical.
  A is the recommended default. Selection is stored in the URL hash; no app theme is modified.
  All artwork is a lightweight UI reconstruction based on the supplied Herdr screenshot.
-->
<style>
  :root {
    color-scheme: light;
    --page: #f3f4f6;
    --paper: #ffffff;
    --ink: #191d24;
    --copy: #5b6472;
    --faint: #7a8492;
    --line: #dde1e7;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 42px 32px 116px; background: var(--page); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, summary:focus-visible, input:focus-visible + .option-mark { outline: 3px solid #2563eb; outline-offset: 3px; }
  .page { max-width: 1480px; margin: 0 auto; }
  .masthead { display: flex; justify-content: space-between; gap: 32px; align-items: end; margin-bottom: 28px; }
  .eyebrow { color: #697586; font: 600 11px/1.2 var(--font-mono); letter-spacing: .13em; text-transform: uppercase; }
  h1 { margin: 10px 0 8px; font-size: clamp(25px, 3vw, 36px); line-height: 1.15; letter-spacing: -.035em; font-weight: 680; }
  .lede { margin: 0; max-width: 690px; color: var(--copy); font-size: 14px; line-height: 1.7; }
  .study-meta { flex: none; padding-bottom: 3px; text-align: right; color: var(--faint); font: 11px/1.8 var(--font-mono); }
  .study-meta strong { display: block; color: var(--ink); font-size: 24px; line-height: 1; font-weight: 500; }
  .themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  .theme-card {
    position: relative; min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--paper); box-shadow: 0 8px 28px -24px #1d2738;
    transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }
  .theme-card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -24px #1d2738; }
  .theme-card.selected { border-color: var(--choice); box-shadow: 0 0 0 1px var(--choice), 0 16px 38px -26px var(--choice); }
  .card-head { display: flex; gap: 12px; align-items: flex-start; min-height: 54px; margin-bottom: 15px; }
  .letter { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 9px; background: var(--choice-soft); color: var(--choice-ink); font: 650 13px/1 var(--font-mono); }
  .title-block { min-width: 0; }
  .title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  h2 { margin: 0; font-size: 16px; line-height: 1.35; letter-spacing: -.015em; font-weight: 650; }
  .recommended { padding: 2px 6px; border-radius: 4px; background: var(--choice-soft); color: var(--choice-ink); font-size: 10px; font-weight: 600; }
  .description { margin: 4px 0 0; color: #697381; font-size: 12px; line-height: 1.5; }
  .select-control { position: relative; flex: none; margin-left: auto; cursor: pointer; }
  .select-control input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .option-mark { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border: 1px solid #d9dee5; border-radius: 8px; background: #fff; color: #606b79; font-size: 11px; font-weight: 550; }
  .option-mark::before { content: ""; width: 7px; height: 7px; border: 1px solid #a3acb8; border-radius: 50%; }
  .selected .option-mark { border-color: var(--choice); background: var(--choice); color: #fff; }
  .selected .option-mark::before { border-color: #fff; background: #fff; box-shadow: inset 0 0 0 2px var(--choice); }

  /* Same DOM and geometry in every preview; only custom properties differ. */
  .app-frame { overflow: hidden; aspect-ratio: 16 / 9.35; border: 1px solid var(--line); border-radius: 11px; background: var(--canvas); color: var(--foreground); font-size: 8px; }
  .window-bar { height: 7.5%; min-height: 23px; display: flex; align-items: center; gap: 4px; padding: 0 9px; border-bottom: 1px solid var(--line); background: var(--chrome); }
  .traffic { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); opacity: .48; }
  .window-title { margin-left: 5px; font-weight: 650; font-size: 8px; }
  .window-tabs { display: flex; gap: 4px; margin-left: auto; color: var(--dim); }
  .window-tabs span { padding: 3px 6px; border-radius: 3px; }
  .window-tabs .active { background: var(--hover); color: var(--foreground); }
  .workspace { display: grid; grid-template-columns: 25% 51% 24%; height: 92.5%; }
  .sidebar { min-width: 0; padding: 8px 6px; border-right: 1px solid var(--line); background: var(--chrome); }
  .side-heading { display: flex; justify-content: space-between; padding: 0 4px 7px; color: var(--foreground); font-size: 8px; font-weight: 650; }
  .side-heading span { color: var(--dim); font-weight: 400; }
  .side-tabs { display: flex; gap: 2px; margin: 0 2px 8px; padding: 2px; border-radius: 4px; background: var(--hover); color: var(--dim); font-size: 6px; }
  .side-tabs span { flex: 1; padding: 3px 0; text-align: center; }
  .side-tabs .active { border-radius: 3px; background: var(--raised); color: var(--foreground); box-shadow: 0 1px 2px #2430440d; }
  .space { padding: 5px 4px; color: var(--muted); font-weight: 600; }
  .space i { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 2px; background: var(--accent); opacity: .7; }
  .tree-row { display: flex; align-items: center; gap: 3px; min-height: 15px; padding: 2px 4px 2px 10px; border-radius: 3px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .tree-row.nested { padding-left: 18px; }
  .tree-row.selected { background: var(--selected); color: var(--foreground); }
  .tree-row:hover { background: var(--hover); }
  .status-dot { flex: none; width: 4px; height: 4px; border-radius: 50%; background: var(--idle); }
  .status-dot.working { background: var(--working); }
  .status-dot.done { background: var(--done); }
  .tree-row .time { margin-left: auto; color: var(--dim); font-size: 5.5px; }
  .agents-label { margin: 9px 4px 5px; padding-top: 7px; border-top: 1px solid var(--line); color: var(--dim); font-size: 7px; font-weight: 600; }
  .main-stage { min-width: 0; padding: 6px; background: var(--canvas); }
  .pane { overflow: hidden; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
  .pane:last-child { margin-bottom: 0; }
  .pane.primary { height: 60%; }
  .pane.secondary { height: calc(40% - 12px); }
  .pane-head { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .pane-head.running { background: var(--selected); }
  .pane-id { color: var(--accent); font: 6px/1 var(--font-mono); }
  .pane-title { overflow: hidden; color: var(--foreground); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .pane-path { margin-left: auto; color: var(--dim); font-size: 5.5px; }
  .terminal { height: calc(100% - 22px); padding: 7px 8px; overflow: hidden; color: var(--muted); font: 6.3px/1.65 var(--font-mono); }
  .terminal .command { color: var(--accent); }
  .terminal .strong { color: var(--foreground); font-weight: 600; }
  .terminal .success { color: var(--done); }
  .terminal .warning { color: var(--blocked); }
  .code-box { margin: 4px 0; padding: 5px 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--muted); }
  .todo { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); }
  .progress { height: 2px; margin-top: 6px; overflow: hidden; border-radius: 2px; background: var(--hover); }
  .progress::after { content: ""; display: block; width: 68%; height: 100%; background: var(--working); }
  .inspector { min-width: 0; padding: 7px 6px; border-left: 1px solid var(--line); background: var(--surface); }
  .inspector-title { display: flex; justify-content: space-between; margin: 0 2px 8px; font-size: 8px; font-weight: 650; }
  .inspector-title span { color: var(--dim); font-size: 6px; font-weight: 400; }
  .metric-card { margin-bottom: 6px; padding: 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--raised); }
  .metric-card.focus { border-color: var(--selected); background: var(--selected); }
  .metric-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 6.5px; }
  .metric-value { margin: 4px 0; color: var(--foreground); font: 600 13px/1.2 var(--font-mono); letter-spacing: -.04em; }
  .metric-note { color: var(--dim); font-size: 5.8px; }
  .bar-chart { display: flex; align-items: end; gap: 3px; height: 30px; margin-top: 7px; padding-top: 4px; border-top: 1px solid var(--line); }
  .bar-chart i { flex: 1; border-radius: 1px 1px 0 0; background: var(--accent); opacity: .8; }
  .bar-chart i:nth-child(1) { height: 38%; } .bar-chart i:nth-child(2) { height: 74%; }
  .bar-chart i:nth-child(3) { height: 100%; } .bar-chart i:nth-child(4) { height: 63%; }
  .bar-chart i:nth-child(5) { height: 48%; } .bar-chart i:nth-child(6) { height: 29%; }

  .palette-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 13px; }
  .swatch { min-width: 0; }
  .swatch-color { height: 24px; border: 1px solid #17203312; border-radius: 5px; }
  .swatch-name { display: block; margin-top: 4px; overflow: hidden; color: #7a8491; font: 8px/1.2 var(--font-mono); text-overflow: ellipsis; }
  details { margin-top: 12px; border-top: 1px solid #eceff2; }
  summary { width: max-content; padding: 10px 0 2px; color: #626d7b; cursor: pointer; font-size: 11px; user-select: none; }
  .token-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; padding-top: 10px; }
  .token { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 6px; align-items: center; min-width: 0; }
  .token i { width: 12px; height: 12px; border: 1px solid #17203312; border-radius: 3px; }
  .token span { overflow: hidden; color: #7a8491; font: 8px/1.3 var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
  .token b { display: block; color: #46515f; font-weight: 500; }

  .selection-bar { position: fixed; z-index: 10; right: 24px; bottom: 20px; left: 24px; display: flex; align-items: center; gap: 16px; max-width: 760px; margin: auto; padding: 12px 12px 12px 18px; border: 1px solid #d8dde4; border-radius: 14px; background: #fffffff2; box-shadow: 0 14px 44px -16px #1b263b4d; backdrop-filter: blur(16px); }
  .selection-copy { min-width: 0; flex: 1; }
  .selection-kicker { display: block; margin-bottom: 2px; color: #7b8592; font-size: 10px; }
  .selection-name { display: block; overflow: hidden; font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .selection-hint { color: #7a8491; font-size: 10px; }
  .copy-button { min-width: 132px; min-height: 40px; padding: 0 16px; border: 0; border-radius: 9px; background: #202630; color: #fff; font-size: 12px; font-weight: 600; }
  .copy-button:hover { background: #354052; }
  .copy-button.copied { background: #176b52; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (max-width: 980px) {
    body { padding: 30px 20px 112px; }
    .themes { grid-template-columns: 1fr; }
    .app-frame { font-size: 9px; }
  }
  @media (max-width: 560px) {
    body { padding: 24px 12px 122px; }
    .masthead { align-items: start; }
    .study-meta { display: none; }
    .theme-card { padding: 12px; border-radius: 13px; }
    .card-head { gap: 9px; }
    .description { max-width: 240px; }
    .app-frame { aspect-ratio: 1.35; }
    .window-tabs, .pane-path, .tree-row .time { display: none; }
    .workspace { grid-template-columns: 28% 72%; }
    .inspector { display: none; }
    .palette-strip { gap: 4px; }
    .token-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .selection-bar { right: 12px; bottom: 12px; left: 12px; gap: 10px; padding-left: 13px; }
    .selection-hint { display: none; }
    .copy-button { min-width: 112px; padding: 0 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .theme-card { transition: none; } .theme-card:hover { transform: none; } }
</style>
</head>

        <div class="metric-card"><div class="metric-label"><span>用量概览</span><span>今天</span></div><div class="metric-value">117.2M</div><div class="metric-note">Token · 594 requests</div><div class="bar-chart"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </aside>
    </div>
  </div>`;

const container = document.querySelector('#themes');
const selectionName = document.querySelector('#selection-name');
const copyButton = document.querySelector('#copy-button');
const announcer = document.querySelector('#announcer');
let selectedId = 'a';

function colorMix(hex, opacity) {
  const value = hex.replace('#', '');
  return `rgba(${parseInt(value.slice(0,2),16)}, ${parseInt(value.slice(2,4),16)}, ${parseInt(value.slice(4,6),16)}, ${opacity})`;
}

function cardTemplate(theme) {
  const colors = theme.json.colors;
  const palette = ['canvas','surface','accent','selected','border'];
  const tokens = [['background', theme.json.background], ['foreground', theme.json.foreground], ...Object.entries(colors)];
  return `<article class="theme-card" data-theme="${theme.id}" style="--choice:${colors.accent};--choice-soft:${colors.selected};--choice-ink:${colors.accent};${Object.entries(colors).map(([key,value]) => `--${key}:${value}`).join(';')};--foreground:${theme.json.foreground}">
    <div class="card-head">
      <span class="letter">${theme.letter}</span>
      <div class="title-block"><div class="title-line"><h2>${theme.name}</h2>${theme.recommended ? '<span class="recommended">推荐</span>' : ''}</div><p class="description">${theme.description}</p></div>
      <label class="select-control"><input type="radio" name="theme" value="${theme.id}" aria-label="选择 ${theme.letter} ${theme.name}"><span class="option-mark">选择</span></label>
    </div>
    ${preview}
    <div class="palette-strip">${palette.map(key => `<div class="swatch"><div class="swatch-color" style="background:${colors[key]}"></div><span class="swatch-name">${key}</span></div>`).join('')}</div>
    <details><summary>查看完整色板</summary><div class="token-grid">${tokens.map(([key,value]) => `<div class="token"><i style="background:${value}"></i><span>${key}<b>${value}</b></span></div>`).join('')}</div></details>
  </article>`;
}

function currentTheme() { return themes.find(theme => theme.id === selectedId); }
function selectTheme(id, updateUrl = true) {
  if (!themes.some(theme => theme.id === id)) id = 'a';
  selectedId = id;
  document.querySelectorAll('.theme-card').forEach(card => {
    const selected = card.dataset.theme === id;
    card.classList.toggle('selected', selected);
    const input = card.querySelector('input');
    input.checked = selected;
    card.querySelector('.option-mark').textContent = selected ? '已选择' : '选择';
  });
  const theme = currentTheme();
  selectionName.textContent = `${theme.letter} · ${theme.name} / ${theme.english}`;
  if (updateUrl) history.replaceState(null, '', `#${id}`);
}

container.innerHTML = themes.map(cardTemplate).join('');
container.addEventListener('change', event => {
  if (event.target.matches('input[name="theme"]')) {
    selectTheme(event.target.value);
    announcer.textContent = `已选择 ${currentTheme().letter} ${currentTheme().name}`;
  }
});
window.addEventListener('hashchange', () => selectTheme(location.hash.slice(1), false));
selectTheme(location.hash.slice(1) || 'a', false);

copyButton.addEventListener('click', async () => {
  const text = JSON.stringify(currentTheme().json, null, 2);
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      textarea.remove();
      if (!copied) throw new Error('copy unavailable');
    }
    copyButton.textContent = '已复制 JSON';
    copyButton.classList.add('copied');
    announcer.textContent = `${currentTheme().name}主题 JSON 已复制`;
    setTimeout(() => { copyButton.textContent = '复制主题 JSON'; copyButton.classList.remove('copied'); }, 1800);
  } catch {
    copyButton.textContent = '复制失败，请展开色板';
    announcer.textContent = '浏览器未允许复制，请展开所选方案的完整色板';
  }
});
</script>
</body>
</html>
