<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar · Design directions</title>
<style>
:root{color-scheme:dark;--bg:#17191c;--surface:#202328;--surface-2:#282c31;--line:#34383e;--ink:#e6e8eb;--muted:#969ba3;--dim:#70757d;--blue:#75b7f2;--green:#34c77b;--orange:#ed9b55;--pink:#d865a4;--purple:#9e8be8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#111315;color:var(--ink)}.top{max-width:1240px;margin:0 auto;padding:26px 24px 18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#8c929a;text-transform:uppercase}.top h1{font-size:22px;font-weight:570;letter-spacing:-.03em;margin:8px 0 4px}.top p{margin:0;color:#9298a0;font-size:13px}.key{font-size:11px;color:#828891}.stage{max-width:1240px;margin:0 auto;padding:4px 24px 34px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.concept{min-width:0}.label{height:50px;display:flex;align-items:center;gap:9px}.num{font-size:11px;color:#777d85;font-variant-numeric:tabular-nums}.label b{font-size:14px;font-weight:560}.label span:last-child{font-size:11px;color:#858b93;margin-left:auto}.shell{height:1030px;border:1px solid #33373d;border-radius:12px;background:var(--bg);overflow:auto;box-shadow:0 16px 40px #0003;scrollbar-width:thin;scrollbar-color:#383d44 transparent}.sidebar{min-height:100%;display:flex;flex-direction:column;padding:12px 10px 0}.section-head{height:35px;display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}.section-head strong{color:var(--ink);font-weight:560}.section-head .spacer{flex:1}.iconbtn{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:#9ba1a9;font-size:16px}.iconbtn:hover,.section-head:hover{background:#ffffff09}.count{color:#798089;font-size:11px}.space-list{display:grid;gap:5px}.space{border-radius:8px;padding:6px 7px 7px;min-height:43px}.space.active{background:var(--surface-2);outline:1px solid #3b4249}.space:hover{background:#25292e}.space-top{height:29px;display:flex;align-items:center;gap:8px;min-width:0}.chev{width:13px;color:#838992;font-size:12px;text-align:center}.avatar{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;flex:none}.space-name{font-size:12.5px;font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.space-meta{font-size:10px;color:#818790;white-space:nowrap}.children{margin:2px 0 1px 20px;padding-left:12px;border-left:1px solid #4a4f56;display:grid;gap:3px}.child{height:29px;display:flex;align-items:center;gap:8px;color:#aeb3ba;font-size:10.5px;min-width:0}.child .glyph{color:#898f97;font-size:12px;width:13px}.child .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.child .branch{color:#747b84;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.child time{font-size:9px;color:#69717a;white-space:nowrap}.divider{height:1px;background:var(--line);margin:10px 5px 8px}.agents-head{height:34px;display:flex;align-items:center;padding:0 8px;gap:8px;cursor:pointer}.agents-head b{font-size:12.5px;font-weight:570}.agents-head .spacer{flex:1}.archive{font-size:10px;color:#8b929a;border:1px solid #3a3e44;border-radius:5px;padding:4px 6px}.search{height:32px;border:1px solid #363a40;background:#202328;border-radius:7px;display:flex;align-items:center;padding:0 9px;gap:7px;color:#858c95;font-size:11px;margin:4px 3px 8px}.state{margin:3px 0}.state-head{height:30px;display:flex;align-items:center;padding:0 8px;gap:8px;cursor:pointer}.dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}.state-name{font-size:11.5px;flex:1}.badge{font-size:10px;color:#a5abb2;background:#282c31;border-radius:5px;padding:3px 6px;min-width:20px;text-align:center}.agent{background:#22262b;border:1px solid #363b42;border-radius:8px;padding:8px 8px;margin:3px 0 3px 2px;display:flex;align-items:center;gap:8px;min-height:48px}.agent-mark{width:18px;height:18px;border-radius:5px;background:#394f68;color:#a9cef1;display:grid;place-items:center;font-size:10px}.agent-text{min-width:0;flex:1}.agent-title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-sub{font-size:9px;color:#858c94;margin-top:4px}.elapsed{font-size:10px;color:#858c94}.footer{margin-top:auto;border-top:1px solid #30343a;padding:8px 4px 12px;display:grid;gap:1px}.footrow{height:31px;display:flex;align-items:center;gap:9px;padding:0 8px;color:#9da3aa;font-size:11.5px}.footrow span:first-child{font-size:14px;color:#7c838b}.note{padding:13px 3px 0;color:#828890;font-size:11px;line-height:1.5}.collapsed{display:none!important}
/* Direction 1: quiet structure */.v1 .space{background:transparent;border:0;border-radius:5px;padding-left:5px}.v1 .space.active{background:#22272c;outline:0}.v1 .space.active .space-name{color:#f1f3f4}.v1 .children{border-left-color:#3b4046}.v1 .agent{background:transparent;border-color:transparent;padding-left:7px}.v1 .state{border-bottom:1px solid #292d32;padding-bottom:4px}.v1 .divider{margin-top:7px}
/* Direction 2: compact rows */.v2 .sidebar{padding-left:8px;padding-right:8px}.v2 .space-list{gap:2px}.v2 .space{padding:4px 6px 5px;border:1px solid transparent;min-height:38px}.v2 .space.active{background:#23272c;border-color:#363c43}.v2 .avatar{border-radius:50%;width:19px;height:19px}.v2 .children{margin-left:19px;gap:0;border-left:1px solid #40454b}.v2 .child{height:25px}.v2 .agent{min-height:40px;background:#202328;border:0;margin-left:0;padding:6px 7px}.v2 .search{height:29px}.v2 .divider{margin:7px 4px}.v2 .state-head{height:27px}
/* Direction 3: low-chrome sections */.v3 .section-head{height:38px;padding:0 6px;border-bottom:1px solid #292d32;margin-bottom:5px}.v3 .space-list{gap:1px}.v3 .space{padding:4px 5px 5px;border-radius:4px}.v3 .space.active{background:#21262b;outline:0;border-left:2px solid #738da5;padding-left:3px}.v3 .avatar{width:18px;height:18px;border-radius:5px}.v3 .children{margin-left:18px}.v3 .agents-head{height:38px;border-bottom:1px solid #292d32;padding:0 6px;margin-bottom:5px}.v3 .agent{background:transparent;border:0;border-top:1px solid #2c3035;border-radius:0;margin:0;padding:7px 5px;min-height:40px}.v3 .state{margin:2px 0}.v3 .state-head{height:27px}.v3 .archive{border:0;background:#24282d}
@media(max-width:850px){.stage{grid-template-columns:1fr;max-width:480px}.shell{height:920px}.top{align-items:start;flex-direction:column}.key{display:none}}
</style>
</head>
<body>
<header class="top"><div><div class="eyebrow">SIDEBAR · VISUAL STUDY</div><h1>侧边栏视觉方向</h1><p>收敛容器感，保留信息与操作；Spaces / Agents 标题可折叠。</p></div><div class="key">点击标题试用折叠 · 三种方向</div></header>
<main class="stage" id="stage"></main>
<script>
const spaces=[
 {name:'需求研发部',n:'2 项目',icon:'需',color:'#20a99c',active:true,rows:[['◉','1111｜探索｜单站点接入','release/2026_11…','昨天 18:02'],['›_','Oh My Pi (OMP)','release/2026_11…','上周四 10:49']]},
 {name:'Compound Powers 插件研发部',n:'1 项目',icon:'C',color:'#d65d9c',rows:[['▰','compound-powers','main','今天 11:30']]},
 {name:'Herdr 定制研发部',n:'1 项目',icon:'H',color:'#de8050',active:true,rows:[['⚑','π > calvin','','今天 11:18']]},
 {name:'Mythos 研发部',n:'1 项目',icon:'M',color:'#8978eb',rows:[['▱','π > 1113｜研究｜需求评审标准','2 项','今天 15:06'],['⚑','π > 1116｜研究｜PRD双维…','pre-add-front','—'],['⚑','π > 1113｜研究｜需…','pre-add-front','昨天 10:22']]},
 {name:'DRN 迁移部',n:'2 项目',icon:'D',color:'#39ae79',rows:[['◉','路由迁移','main','昨天 09:20']]},
 {name:'D2C 协作台研发部',n:'2 项目',icon:'D',color:'#d5609d',rows:[['▱','π > 1116｜修复｜恢复会话…','4 项','今天 15:03'],['⚑','π > 1116｜探索｜此前…','codex/initial-mig…','—'],['⚑','π > 1116｜修复…','codex/initial-mig…','昨天 21:40']]},
 {name:'个人空间',n:'1 项目',icon:'P',color:'#6a9bd2',rows:[['›_','Oh My Pi','main','昨天 19:14']]}
];
const states=[['Needs you',0,'#ed902e'],['Working',1,'#4388ee'],['Done',0,'#27bd70'],['Idle',12,'#28ba70']];
const directions=[['01','Quiet hierarchy','几乎去掉卡片，只让选中态轻轻浮现。'],['02','Compact rows','保留轻量分组底色，减少行高与空隙。'],['03','Open list','以细分隔线组织内容，边界更少。']];
const stage=document.querySelector('#stage');
for(let d=0;d<3;d++){
 const concept=document.createElement('section');concept.className='concept';
 concept.innerHTML=`<div class="label"><span class="num">${directions[d][0]}</span><b>${directions[d][1]}</b><span>${directions[d][2]}</span></div><div class="shell"><div class="sidebar v${d+1}">
 <div class="section-head fold" data-target="spaces-body"><span class="chev">⌄</span><strong>Spaces</strong><span class="count">7</span><span class="spacer"></span><span class="iconbtn">＋</span></div>
 <div id="spaces-body"><div class="space-list">${spaces.map((s,i)=>`<div class="space ${s.active?'active':''}"><div class="space-top"><span class="chev">${i===1||i===4?'›':'⌄'}</span><span class="avatar" style="background:${s.color}">${s.icon}</span><span class="space-name">${s.name}</span><span class="space-meta">${s.n}</span><span class="iconbtn">＋</span></div><div class="children">${s.rows.map(r=>`<div class="child"><span class="glyph">${r[0]}</span><span class="title">${r[1]}</span>${r[2]?`<span class="branch">⌁ ${r[2]}</span>`:''}<time>${r[3]}</time></div>`).join('')}</div></div>`).join('')}</div></div>
 <div class="divider"></div>
 <div class="agents-head fold" data-target="agents-body"><span class="chev">⌄</span><b>Agents</b><span class="spacer"></span><span class="archive">▣ &nbsp;Archived (0)</span></div>
 <div id="agents-body"><div class="search">⌕ <span>Search agents...</span></div>${states.map(([name,count,color],i)=>`<div class="state"><div class="state-head fold" data-target="group-${d}-${i}"><span class="chev">⌄</span><span class="dot" style="background:${color}"></span><span class="state-name">${name}</span><span class="badge">${count}</span></div><div id="group-${d}-${i}">${name==='Working'?`<div class="agent"><span class="agent-mark">Π</span><div class="agent-text"><div class="agent-title">π :: 1116｜研究｜小程序跳转企业微信</div><div class="agent-sub">打杂部</div></div><span class="elapsed">0:13</span></div>`:''}${name==='Idle'?'<div class="agent"><span class="agent-mark">Π</span><div class="agent-text"><div class="agent-title">Oh My Pi (OMP)</div><div class="agent-sub">需求研发部 · release/2026_11…</div></div><span class="elapsed">›</span></div>':''}</div></div>`).join('')}</div>
 <div class="footer"><div class="footrow"><span>⚙</span>Settings</div><div class="footrow"><span>＋</span>Add machine</div></div></div></div>`;
 stage.append(concept);
}
document.addEventListener('click',e=>{const h=e.target.closest('.fold');if(!h)return;const body=document.getElementById(h.dataset.target);if(!body)return;const hidden=body.classList.toggle('collapsed');const c=h.querySelector('.chev');if(c)c.textContent=hidden?'›':'⌄';});
</script>
</body>
</html>
